      security:
        - 
          bearer: []
  /v2/members:
    get:
      operationId: MembersController_getAllMembers
      summary: Get all members (paginated, optional name filter for the BO table)
      parameters:
        - 
          name: page
          required: false
          in: query
          schema:
            type: number
        - 
          name: pageSize
          required: false
          in: query
          schema:
            type: number
        - 
          name: name
          required: false
          in: query
          description: Filter by name (Vietnamese-insensitive), used by the members table search
          schema:
            type: string
        - 
          name: sortBy
          required: false
          in: query
          schema:
            enum:
              - created_at
              - name
              - generation
            type: string
        - 
          name: sortOrder
          required: false
          in: query
          schema:
            enum:
              - asc
              - desc
            type: string
        - 
          name: view
          required: false
          in: query
          description: "Độ chi tiết của payload. Bỏ trống = `full` (mặc định, KHÔNG đổi shape).\n- `full`  → PaginatedMembersResponseDto (mặc định)\n- `table` → PaginatedMembersTableResponseDto (bỏ biography/notes — dùng cho bảng data BO)\n- `lite`  → PaginatedMembersLiteResponseDto (id + name + avatar + generation)"
          schema:
            enum:
              - lite
              - table
              - full
            type: string
        - 
          name: tree_id
          required: false
          in: query
          description: Lọc theo chi nhánh (UUID, FK tới Tree). Dropdown lấy từ GET /v2/tree.
          schema:
            type: string
        - 
          name: gender
          required: false
          in: query
          description: Lọc theo giới tính
          schema:
            enum:
              - M
              - F
              - O
              - U
            type: string
        - 
          name: generation
          required: false
          in: query
          description: Lọc theo thế hệ (giá trị hiệu lực trên member)
          schema:
            type: number
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMembersResponseDto"
      tags:
        - Members
      security:
        - 
          bearer: []
    post:
      operationId: MembersController_createMember
      summary: Create new member + profile (editor trở lên)
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberDto"
      responses:
        201:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponseDto"
      tags:
        - Members
      security:
        - 
          bearer: []
