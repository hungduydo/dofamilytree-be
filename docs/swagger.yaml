  /v2/contact/info:
    get:
      operationId: ContactController_getInfo
      summary: "Thông tin liên hệ: kênh liên lạc, nhà thờ họ, giờ mở cửa, ban liên lạc (public)"
      description: "Chưa seed dòng contact_info vẫn trả 200 với danh sách rỗng — KHÔNG phải 404: trang cần phân biệt \"dòng họ chưa điền\" với \"request lỗi\". `board[].phone`/`.email` là null với người gọi không có quyền xem thông tin liên lạc (dưới `member`, và cả `editor`)."
      parameters: []
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactInfoDto"
      tags:
        - Contact (Liên hệ Ban liên lạc)
      security:
        - 
          bearer: []
    put:
      operationId: ContactController_updateInfo
      summary: Cập nhật thông tin liên hệ của dòng họ (admin)
      description: "THAY THẾ TRỌN KHỐI: `channels` và `hours` được ghi lại theo đúng thứ tự trong mảng, nên gửi cả danh sách chứ không gửi từng dòng. Shape khớp chính xác thứ GET /contact/info trả về (trừ `board`, vốn chiếu từ `members` — sửa ban liên lạc ở màn hình Thành viên, bằng cách bật `clanRole` cho người đó). Xoá cache của route public ngay sau khi lưu."
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactInfoDto"
      responses:
        200:
          description: Khối thông tin sau khi lưu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactInfoDto"
        400:
          description: Dữ liệu không hợp lệ
      tags:
        - Contact (Liên hệ Ban liên lạc)
      security:
        - 
          bearer: []
  /v2/contact/messages:
    post:
      operationId: ContactController_createMessage
      summary: Gửi tin nhắn cho ban liên lạc (public, có giới hạn tần suất)
      description: "Multipart MỘT LẦN GỬI, không phải upload-rồi-tham-chiếu: người nhà đính kèm ảnh chụp một trang viết tay, và luồng hai bước sẽ bỏ lại tệp mồ côi mỗi lần họ bỏ dở form. Tối đa 3 tệp (image/jpeg, image/png, application/pdf), mỗi tệp và TỔNG body đều bị chặn ở 4.5 MB. Giới hạn tần suất: 3/giờ, 10/ngày theo IP."
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - topic
                - fullName
                - phone
                - content
              properties:
                topic:
                  type: string
                  enum:
                    - GENEALOGY
                    - GRAVE
                    - EVENT
                    - SCHOLARSHIP
                    - OTHER
                fullName:
                  type: string
                  example: Nguyễn Văn An
                phone:
                  type: string
                  example: 0988 123 456
                email:
                  type: string
                  example: an.nguyen@example.com
                branch:
                  type: string
                  example: Chi thứ ba, Đông Ngạc
                content:
                  type: string
                  minLength: 20
                  maxLength: 2000
                attachments:
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 3
      responses:
        201:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessageReceiptDto"
        400:
          description: Dữ liệu không hợp lệ — `message` là câu tiếng Việt cho người gửi đọc
        413:
          description: Tệp đính kèm hoặc tổng body vượt giới hạn
        429:
          description: Vượt giới hạn tần suất theo IP
      tags:
        - Contact (Liên hệ Ban liên lạc)
      security:
        - 
          bearer: []
    get:
      operationId: ContactController_getMessages
      summary: Hộp thư ban liên lạc — mới nhất trước (admin)
      description: "KHÔNG cache: admin vừa đổi trạng thái phải thấy ngay. `sender_ip_hash` cố ý KHÔNG được trả ra — nó để rà soát spam trực tiếp trên DB, không phải để nhận diện người gửi trên BO."
      parameters:
        - 
          name: page
          required: false
          in: query
          schema:
            type: number
        - 
          name: pageSize
          required: false
          in: query
          description: Mặc định 20, tối đa 100
          schema:
            type: number
        - 
          name: status
          required: false
          in: query
          schema:
            enum:
              - NEW
              - IN_PROGRESS
              - ANSWERED
              - SPAM
              - DELETED
            type: string
        - 
          name: topic
          required: false
          in: query
          schema:
            enum:
              - GENEALOGY
              - GRAVE
              - EVENT
              - SCHOLARSHIP
              - OTHER
            type: string
        - 
          name: q
          required: false
          in: query
          description: Tìm trong mã tham chiếu, họ tên và số điện thoại. Đây là đường người trực điện thoại dùng khi người nhà đọc "LH-2608-0431" qua máy.
          schema:
            type: string
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedContactMessagesDto"
      tags:
        - Contact (Liên hệ Ban liên lạc)
      security:
        - 
          bearer: []
  /v2/contact/messages/stats:
    get:
      operationId: ContactController_getMessageStats
      summary: Đếm thư theo từng trạng thái, cho badge trên thanh điều hướng BO (admin)
      description: "Endpoint riêng thay vì nhét vào response danh sách: badge được đọc ở MỌI trang của /bo, còn danh sách thì không — gộp lại buộc mọi trang tải cả một trang tin nhắn chỉ để lấy số."
      parameters: []
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessageStatsDto"
      tags:
        - Contact (Liên hệ Ban liên lạc)
      security:
        - 
          bearer: []
  /v2/contact/messages/{id}:
    get:
      operationId: ContactController_getMessageById
      summary: Một tin nhắn (admin)
      description: Để `/bo/contact/messages/:id` deep-link và refresh được, kể cả khi tin nhắn đã trôi qua trang 1 của hộp thư.
      parameters:
        - 
          name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessageDto"
        404:
          description: Không tìm thấy tin nhắn này
      tags:
        - Contact (Liên hệ Ban liên lạc)
      security:
        - 
          bearer: []
    patch:
      operationId: ContactController_updateMessageStatus
      summary: Đánh dấu một tin nhắn đã xử lý tới đâu (admin)
      parameters:
        - 
          name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactMessageStatusDto"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessageDto"
        404:
          description: Không tìm thấy tin nhắn này
      tags:
        - Contact (Liên hệ Ban liên lạc)
      security:
        - 
          bearer: []
    delete:
      operationId: ContactController_deleteMessage
      summary: Xoá mềm một tin nhắn (admin)
      description: "Chuyển sang trạng thái DELETED — dòng và tệp đính kèm VẪN CÒN, thư chỉ biến mất khỏi hộp thư mặc định. Khôi phục bằng PATCH với status khác; xem thùng rác bằng ?status=DELETED. LƯU Ý: bucket đang để public-read, nên tệp đính kèm của thư đã xoá vẫn đọc được bởi ai còn giữ URL — route này giấu thư, KHÔNG thu hồi quyền đọc tệp."
      parameters:
        - 
          name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        204:
          description: Đã chuyển sang DELETED
        404:
          description: Không tìm thấy tin nhắn này
      tags:
        - Contact (Liên hệ Ban liên lạc)
      security:
        - 
          bearer: []
info:
  title: Family Tree API v2
  description: "## Vietnamese Family Tree Management API\n\n**Base URL:** `http://localhost:3002/v2`\n\n**Authentication:** Bearer JWT token (same as backend v1)\n\n### Modules\n- **Members** — CRUD thành viên + profile + avatar (async upload)\n- **Relationships** — Quan hệ mới (BIOLOGICAL/ADOPTED/SPOUSE) + tìm tổ tiên/con cháu\n- **Tree** — Cây gia phả full (Redis cache 1h) + subtree 4 thế hệ\n- **Anniversaries** — Ngày giỗ (filter by member, month, upcoming)\n- **Events** — Sự kiện dòng họ + notification queue\n- **Media** — Thư viện media: upload mọi loại (ảnh nén lossless bằng sharp; video/audio/tài liệu upload thẳng) → Vercel Blob; phân trang/lọc/tìm kiếm + thống kê + album\n- **Graves** — Mộ phần với tọa độ GPS + tìm kiếm gần nhất\n\n### Queue Jobs (QStash + Redis)\n| Queue | Trigger | Action |\n|-------|---------|--------|\n| avatar-upload | Create/Update member với file | Upload → Vercel Blob → cập nhật avatar_url |\n| media-process | Upload media | Ảnh: sharp nén lossless; khác: upload thẳng → Vercel Blob (off-request) |\n| report-generate | Create/Delete member | Tính stats → lưu Redis |\n| notification | New member/relationship/event | Log (Phase 1) |\n"
  version: 2.0.0
  contact:
    name: Family Tree Team
    url: ""
    email: ""
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      in: header
      description: Dán CHỈ token thô (lấy từ POST /v2/auth/login), KHÔNG kèm tiền tố "Bearer ".
  schemas:
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
        password:
          type: string
          example: password123
          minLength: 6
        fullName:
          type: string
          example: Nguyen Van A
        gender:
          type: string
          example: male
        birthDate:
          type: string
          example: 1990-01-15
        deathDate:
          type: string
          example: 2020-05-10
        generation:
          type: number
          example: 3
        occupation:
          type: string
          example: Software Engineer
        address:
          type: string
          example: Hanoi, Vietnam
        biography:
          type: string
          example: A brief biography...
      required:
        - email
        - password
        - fullName
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
        password:
          type: string
          example: password123
      required:
        - email
        - password
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          example: oldPassword123
        newPassword:
          type: string
          example: newPassword456
          minLength: 6
      required:
        - currentPassword
        - newPassword
    AssignRolesDto:
      type: object
      properties:
        roles:
          type: array
          example:
            - editor
          items:
            type: string
            enum:
              - guest
              - member
              - editor
              - admin
      required:
        - roles
    LinkMemberDto:
      type: object
      properties:
        memberId:
          type: string
          example: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
      required:
        - memberId
    MemberLiteDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Nguyễn Văn A
        avatar_url:
          type: object
          nullable: true
          format: uri
        generation:
          type: number
          nullable: true
          example: 5
          description: Thế hệ hiệu lực (đã tính sẵn). Xem MemberResponseDto.generation.
      required:
        - id
        - name
    ProfileTableDto:
      type: object
      properties:
        occupation:
          type: object
          nullable: true
          example: Kỹ sư phần mềm
        address:
          type: object
          nullable: true
          example: Hà Nội
        phone:
          type: object
          nullable: true
          example: 0988 123 456
        familyPosition:
          type: object
          nullable: true
          example: Con trưởng
        roleTags:
          default: []
          type: array
          items:
            type: string
        committeeRole:
          type: object
          nullable: true
        isCommittee:
          type: boolean
          default: false
        isNotable:
          type: boolean
          default: false
      required:
        - roleTags
        - isCommittee
        - isNotable
    MemberTreeBriefDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: object
          nullable: true
          example: Chi nhánh Phú Thọ
      required:
        - id
    MemberTableDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Nguyễn Văn A
        avatar_url:
          type: object
          nullable: true
          format: uri
        gender:
          type: string
          nullable: true
          enum:
            - M
            - F
            - O
            - U
        birthDate:
          type: object
          nullable: true
          example: 1990-01-01
        deathDate:
          type: object
          nullable: true
          example: 2020-12-31
        tree_id:
          type: object
          nullable: true
          format: uuid
        generation:
          type: number
          nullable: true
          example: 5
        created_at:
          type: string
          format: date-time
        profile:
          nullable: true
          allOf:
            - 
              $ref: "#/components/schemas/ProfileTableDto"
        tree:
          nullable: true
          allOf:
            - 
              $ref: "#/components/schemas/MemberTreeBriefDto"
      required:
        - id
        - name
        - created_at
    PaginatedMembersTableResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MemberTableDto"
        total:
          type: number
          example: 120
        page:
          type: number
          example: 1
        pageSize:
          type: number
          example: 10
      required:
        - data
        - total
        - page
        - pageSize
    PaginatedMembersLiteResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MemberLiteDto"
        total:
          type: number
          example: 120
        page:
          type: number
          example: 1
        pageSize:
          type: number
          example: 10
      required:
        - data
        - total
        - page
        - pageSize
    CommitteeMemberDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          example: Trưởng ban
          description: Lấy từ profile.occupation
        avatar:
          type: string
          format: uri
      required:
        - id
        - name
        - role
        - avatar
    NotableMemberDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          description: Lấy từ profile.biography
        avatar:
          type: string
          format: uri
      required:
        - id
        - name
        - description
        - avatar
    MemberStatsResponseDto:
      type: object
      properties:
        total:
          type: number
          example: 1256
        male:
          type: number
          example: 648
        female:
          type: number
          example: 608
        newThisMonth:
          type: number
          example: 28
          description: Thành viên tạo mới trong tháng hiện tại
        generations:
          type: number
          example: 6
          description: Số thế hệ (distinct generation)
      required:
        - total
        - male
        - female
        - newThisMonth
        - generations
    ProfileResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        fullName:
          type: string
          example: Nguyễn Văn A
        generation:
          type: number
          nullable: true
          example: 5
          description: Thế hệ NHẬP TAY — ưu tiên hơn giá trị suy ra. Xem `member.generation` cho giá trị hiệu lực.
        biography:
          type: object
          nullable: true
        occupation:
          type: object
          nullable: true
          example: Kỹ sư phần mềm
        address:
          type: object
          nullable: true
          example: Hà Nội
        notes:
          type: object
          nullable: true
        phone:
          type: object
          nullable: true
          example: 0988 123 456
        contactEmail:
          type: object
          nullable: true
          example: lienhe@gmail.com
        familyPosition:
          type: object
          nullable: true
          example: Con trưởng
          description: Vị trí trong gia đình
        roleTags:
          default: []
          description: Vai trò trong dòng họ
          type: array
          items:
            type: string
        committeeRole:
          type: object
          nullable: true
          description: Vai trò trong ban/hội đồng (clanRole)
        isCommittee:
          type: boolean
          default: false
        isNotable:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - member_id
        - fullName
        - roleTags
        - isCommittee
        - isNotable
        - created_at
        - updated_at
    MemberResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        private_id:
          type: object
          nullable: true
