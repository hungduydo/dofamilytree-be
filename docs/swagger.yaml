      tags:
        - Auth
      security:
        - 
          bearer: []
  /v2/auth/users/{userId}/link-member:
    post:
      operationId: AuthController_linkMember
      summary: Gắn tài khoản vào một member CÓ SẴN (admin). Guest được nâng lên member.
      parameters:
        - 
          name: userId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkMemberDto"
      responses:
        200:
          description: ""
      tags:
        - Auth
      security:
        - 
          bearer: []
    delete:
      operationId: AuthController_unlinkMember
      summary: Gỡ liên kết tài khoản ↔ member (admin). Member bị hạ về guest.
      parameters:
        - 
          name: userId
          required: true
          in: path
          schema:
            type: string
      responses:
        200:
          description: ""
      tags:
        - Auth
      security:
        - 
          bearer: []
