info:
  title: Family Tree API v2
  description: "## Vietnamese Family Tree Management API\n\n**Base URL:** `http://localhost:3002/v2`\n\n**Authentication:** Bearer JWT token (same as backend v1)\n\n### Modules\n- **Members** — CRUD thành viên + profile + avatar (async upload)\n- **Relationships** — Quan hệ mới (BIOLOGICAL/ADOPTED/SPOUSE) + tìm tổ tiên/con cháu\n- **Tree** — Cây gia phả full (Redis cache 1h) + subtree 4 thế hệ\n- **Anniversaries** — Ngày giỗ (filter by member, month, upcoming)\n- **Events** — Sự kiện dòng họ + notification queue\n- **Media** — Upload ảnh → nén bằng sharp → Vercel Blob\n- **Graves** — Mộ phần với tọa độ GPS + tìm kiếm gần nhất\n\n### Queue Jobs (QStash + Redis)\n| Queue | Trigger | Action |\n|-------|---------|--------|\n| avatar-upload | Create/Update member với file | Upload → Vercel Blob → cập nhật avatar_url |\n| image-process | Upload media | sharp resize + compress → Vercel Blob |\n| report-generate | Create/Delete member | Tính stats → lưu Redis |\n| notification | New member/relationship/event | Log (Phase 1) |\n"
  version: 2.0.0
  contact:
    name: Family Tree Team
    url: ""
    email: ""
tags: []
servers: []
components:
  securitySchemes:
    JWT:
      scheme: bearer
      bearerFormat: JWT
      type: http
      in: header
  schemas:
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
        password:
          type: string
          example: password123
          minLength: 6
        fullName:
          type: string
          example: Nguyen Van A
        gender:
          type: string
          example: male
        birthDate:
          type: string
          example: 1990-01-15
        deathDate:
          type: string
          example: 2020-05-10
        generation:
          type: number
          example: 3
        occupation:
          type: string
          example: Software Engineer
        address:
          type: string
          example: Hanoi, Vietnam
        biography:
          type: string
          example: A brief biography...
      required:
        - email
        - password
        - fullName
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
        password:
          type: string
          example: password123
      required:
        - email
        - password
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          example: oldPassword123
        newPassword:
          type: string
          example: newPassword456
          minLength: 6
      required:
        - currentPassword
        - newPassword
    AssignRolesDto:
      type: object
      properties:
        roles:
          example:
            - member
            - editor
          type: array
          items:
            type: string
      required:
        - roles
    MemberLiteDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Nguyễn Văn A
        avatar_url:
          type: object
          nullable: true
          format: uri
        generation:
          type: number
          nullable: true
          example: 5
          description: Thế hệ hiệu lực (đã tính sẵn). Xem MemberResponseDto.generation.
      required:
        - id
        - name
    ProfileTableDto:
      type: object
      properties:
        occupation:
          type: object
          nullable: true
          example: Kỹ sư phần mềm
        address:
          type: object
          nullable: true
          example: Hà Nội
        phone:
          type: object
          nullable: true
          example: 0988 123 456
        familyPosition:
          type: object
          nullable: true
          example: Con trưởng
        roleTags:
          default: []
          type: array
          items:
            type: string
        committeeRole:
          type: object
          nullable: true
        isCommittee:
          type: boolean
          default: false
        isNotable:
          type: boolean
          default: false
      required:
        - roleTags
        - isCommittee
        - isNotable
    MemberTreeBriefDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: object
          nullable: true
          example: Chi nhánh Phú Thọ
      required:
        - id
    MemberTableDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Nguyễn Văn A
        avatar_url:
          type: object
          nullable: true
          format: uri
        gender:
          type: string
          nullable: true
          enum:
            - M
            - F
            - O
            - U
        birthDate:
          type: object
          nullable: true
          example: 1990-01-01
        deathDate:
          type: object
          nullable: true
          example: 2020-12-31
        tree_id:
          type: object
          nullable: true
          format: uuid
        generation:
          type: number
          nullable: true
          example: 5
        created_at:
          type: string
          format: date-time
        profile:
          nullable: true
          allOf:
            - 
              $ref: "#/components/schemas/ProfileTableDto"
        tree:
          nullable: true
          allOf:
            - 
              $ref: "#/components/schemas/MemberTreeBriefDto"
      required:
        - id
        - name
        - created_at
    PaginatedMembersTableResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MemberTableDto"
        total:
          type: number
          example: 120
        page:
          type: number
          example: 1
        pageSize:
          type: number
          example: 10
      required:
        - data
        - total
        - page
        - pageSize
    PaginatedMembersLiteResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MemberLiteDto"
        total:
          type: number
          example: 120
        page:
          type: number
          example: 1
        pageSize:
          type: number
          example: 10
      required:
        - data
        - total
        - page
        - pageSize
    CommitteeMemberDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          example: Trưởng ban
          description: Lấy từ profile.occupation
        avatar:
          type: string
          format: uri
      required:
        - id
        - name
        - role
        - avatar
    NotableMemberDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          description: Lấy từ profile.biography
        avatar:
          type: string
          format: uri
      required:
        - id
        - name
        - description
        - avatar
    MemberStatsResponseDto:
      type: object
      properties:
        total:
          type: number
          example: 1256
        male:
          type: number
          example: 648
        female:
          type: number
          example: 608
        newThisMonth:
          type: number
          example: 28
          description: Thành viên tạo mới trong tháng hiện tại
        generations:
          type: number
          example: 6
          description: Số thế hệ (distinct generation)
      required:
        - total
        - male
        - female
        - newThisMonth
        - generations
    ProfileResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        fullName:
          type: string
          example: Nguyễn Văn A
        generation:
          type: number
          nullable: true
          example: 5
          description: Thế hệ NHẬP TAY — ưu tiên hơn giá trị suy ra. Xem `member.generation` cho giá trị hiệu lực.
        biography:
          type: object
          nullable: true
        occupation:
          type: object
          nullable: true
          example: Kỹ sư phần mềm
        address:
          type: object
          nullable: true
          example: Hà Nội
        notes:
          type: object
          nullable: true
        phone:
          type: object
          nullable: true
          example: 0988 123 456
        contactEmail:
          type: object
          nullable: true
          example: lienhe@gmail.com
        familyPosition:
          type: object
          nullable: true
          example: Con trưởng
          description: Vị trí trong gia đình
        roleTags:
          default: []
          description: Vai trò trong dòng họ
          type: array
          items:
            type: string
        committeeRole:
          type: object
          nullable: true
          description: Vai trò trong ban/hội đồng (clanRole)
        isCommittee:
          type: boolean
          default: false
        isNotable:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - member_id
        - fullName
        - roleTags
        - isCommittee
