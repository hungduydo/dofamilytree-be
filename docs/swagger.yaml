      summary: Get list of available roles
      parameters: []
      responses:
        200:
          description: ""
      tags:
        - Auth
      security:
        - 
          bearer: []
  /v2/auth/users:
    get:
      operationId: AuthController_listUsers
      summary: Danh sách tài khoản để duyệt (admin). status=pending là hàng đợi guest chờ gắn member.
      parameters:
        - 
          name: status
          required: false
          in: query
          schema:
            enum:
              - pending
              - linked
              - all
            type: string
        - 
          name: role
          required: false
          in: query
          schema:
            enum:
              - guest
              - member
              - editor
              - admin
            type: string
        - 
          name: page
          required: false
          in: query
          schema:
            type: number
        - 
          name: pageSize
          required: false
          in: query
          schema:
            type: number
      responses:
        200:
          description: ""
      tags:
        - Auth
      security:
        - 
          bearer: []
  /v2/auth/users/{userId}/roles:
    put:
      operationId: AuthController_assignRoles
      summary: Đổi role của một tài khoản (admin). Không tự đổi role của chính mình.
      parameters:
        - 
          name: userId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
