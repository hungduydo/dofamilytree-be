  /v2/auth/logout:
    post:
      operationId: AuthController_logout
      summary: Logout (client should discard JWT)
      parameters: []
      responses:
        200:
          description: ""
      tags:
        - Auth
      security:
        - 
          bearer: []
  /v2/auth/change-password:
    post:
      operationId: AuthController_changePassword
      summary: Change password (requires current password verification)
      parameters: []
