  /v2/media/upload:
    post:
      operationId: MediaController_uploadMedia
      summary: Upload media (ảnh → nén lossless bằng sharp; video/audio/tài liệu → upload thẳng)
      description: "File đi QUA serverless function nên chịu trần request body của platform (Vercel: 4.5MB nếu chưa bật Fluid Compute, 100MB nếu đã bật). Với file lớn hơn, dùng POST /v2/media/upload-url."
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadMediaDto"
      responses:
        201:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaResponseDto"
      tags:
        - Media
      security:
        - 
          bearer: []
  /v2/media/upload-url:
    post:
      operationId: MediaController_createUploadUrl
      summary: Cấp presigned URL để client upload file THẲNG lên storage (không qua function)
      description: "Dùng cho audio/video/file lớn vượt trần request body của platform. Luồng 3 bước: (1) POST /v2/media/upload-url → nhận upload_url + media_id; (2) PUT file lên upload_url với đúng header Content-Type đã trả về; (3) POST /v2/media/:id/complete để backend xác minh và chuyển sang ready. Lưu ý: đường này KHÔNG nén ảnh — ảnh nhỏ nên đi POST /v2/media/upload."
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadUrlDto"
      responses:
        201:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponseDto"
      tags:
        - Media
      security:
        - 
          bearer: []
  /v2/media/{id}/complete:
    post:
      operationId: MediaController_completeUpload
      summary: Xác nhận đã PUT xong file lên presigned URL — chuyển media sang ready
      description: Backend HEAD object trên storage để lấy size thật; nếu chưa thấy file sẽ trả 400. Gọi lại trên media đã ready là no-op (idempotent).
      parameters:
        - 
          name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaResponseDto"
      tags:
        - Media
      security:
        - 
          bearer: []
