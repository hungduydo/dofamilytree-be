
openapi: 3.0.0
paths:
  /v2/status:
    get:
      operationId: AppController_getStatus
      summary: Check API status (kèm health của Redis cache)
      parameters: []
      responses:
        200:
          description: ""
      tags:
        - System
  /v2:
    get:
      operationId: AppController_getRoot
      summary: API Root
      parameters: []
      responses:
        200:
          description: ""
      tags:
        - System
  /v2/auth/register:
    post:
      operationId: AuthController_register
      summary: "Register a new user (multipart: optional profilePicture)"
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RegisterDto"
      responses:
        201:
          description: ""
      tags:
        - Auth
  /v2/auth/login:
    post:
      operationId: AuthController_login
      summary: Login and receive JWT token
      parameters: []
      requestBody:
        required: true
